# pump example — launch config.
#
# One Hamilton PSD/4 syringe pump feeding TWO nozzles, to show the
# whole point of the fluid-path capability: the pump is one device with
# one bus row, and each nozzle is just "a tube on valve port N".
#
#   - needle_gripper_1  a needle the robot CARRIES (port 3)
#   - needle_dispense_arm_1    a FIXED nozzle over the rack (port 2)
#
# For each of batch_size vials the robot dips the carried needle, doses
# from it, parks the needle, then the fixed arm doses into the same
# vial — same pump, two paths, no recipe family of its own.
#
# The pump runs in sim by default (volume bookkeeping in memory). Set
# port + simulation:false on pump_1 for the real PSD/4.

project_name: pump
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat


# Where the platform writes — relative to this folder, or absolute.
# Not declared = off: run records stay in memory, no replay is saved,
# a file parameter's Open has no folder.
records:  records         # each run's rt.record files: <run>/records.jsonl, .csv
replays:  replays         # replay recordings
uploads:  uploads         # where a file parameter's Open browses

# The file browser's tabs, in this order — display only: listing a
# folder never makes anything be saved into it.
# read_only: true = browse and download only.
folders:
  - {key: records,  label: Records,  path: records,  read_only: false}
  - {key: uploads,  label: Uploads,  path: uploads,  read_only: false}
  - {key: captures, label: Captures, path: captures, read_only: false}
  - {key: replays,  label: Replays,  path: replays,  read_only: false}
default:
  batch_size:
    type: int
    default: 3
    label: Batch size
    hint: How many vials to dose (needle dose -> arm dose).
    min: 1
    max: 6
  dose_ul:
    type: float
    default: 150.0
    label: Dose (uL)
    hint: Volume dispensed by each nozzle into every vial.
    min: 1.0
    max: 1000.0
