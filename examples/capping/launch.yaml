# capping example — launch config.

project_name: capping_example
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat

default:
  tube_count:
    type: int
    default: 2
    label: Tube count
    hint: Number of tubes to cap, then decap, then return to the rack.
    min: 1
    max: 48
