# barcode example — launch config.
#
# For each of batch_size tubes: pick it from the SBS rack (on plate 4),
# present it to the Zebra DS457 barcode reader, scan the barcode, and
# return it to its slot. The reader runs in sim by default (canned scan
# "SIM-..."); set port + simulation:false on barcode_reader_1 in the
# layout for a real DS457.
#
# Pick → Present → Scan → Place ×N → Park. The Scan is a read-only action
# with declarative retry (project-guide §8): a failed scan re-selects
# itself after recover, no motion repeated.

project_name: barcode
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat


# Where the platform writes — relative to this folder, or absolute.
# Not declared = off: run records stay in memory, no replay is saved,
# a file parameter's Open has no folder.
records:  records         # each run's rt.record files: <run>/records.jsonl, .csv
replays:  replays         # replay recordings
uploads:  uploads         # where a file parameter's Open browses

# The file browser's tabs, in this order — display only: listing a
# folder never makes anything be saved into it.
# read_only: true = browse and download only.
folders:
  - {key: records,  label: Records,  path: records,  read_only: false}
  - {key: uploads,  label: Uploads,  path: uploads,  read_only: false}
  - {key: captures, label: Captures, path: captures, read_only: false}
  - {key: replays,  label: Replays,  path: replays,  read_only: false}
  - {key: log,      label: Log,      path: log,      read_only: true}   # the project's console, orchestrator-written
default:
  batch_size:
    type: int
    default: 4
    label: Batch size
    hint: How many tubes to scan (pick → present to reader → scan → return).
    min: 1
    max: 48
