# scale example — launch config.
#
# For each of batch_size tubes: pick it from the SBS rack (on plate 4),
# place it on the scale, weigh it, pick it back, and return it to its
# slot. The scale runs in sim by default (canned weight ~12.345 g);
# set ip + simulation:false on scale_spx222_1 in the layout for a real
# OHAUS SPX222.

project_name: scale
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat


# The project's folders — the file browser's tabs, in this order.
# key results / data / captures / rec are the platform's (run records,
# input files, the images detections keep, recordings); any other key
# is just a tab. read_only: true = browse and download only.
folders:
  - {key: results,  label: Results,    path: results,  read_only: false}
  - {key: data,     label: Data,       path: data,     read_only: false}
  - {key: captures, label: Captures,   path: captures, read_only: false}
  - {key: rec,      label: Recordings, path: rec,      read_only: false}
default:
  batch_size:
    type: int
    default: 4
    label: Batch size
    hint: How many tubes to weigh (pick → scale → weigh → return).
    min: 1
    max: 48
