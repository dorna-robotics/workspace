# phased example — launch config.
#
# The scale example's bench (one 2 ml rack, one balance), run as TWO
# weigh passes over every tube. The point is the PROJECT SHAPE, not the
# chemistry: a phased protocol whose actions live in a package, one
# module per phase, with the batch regrouping at each phase boundary.

project_name: phased
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions/         # a PACKAGE — actions/__init__.py + one module per phase
checks:       checks.py
phases:       phases.py        # the batch crosses each phase together — DEPTH

plan_window:  4                # WIDTH — tubes per plan/schedule cycle
scheduler:    cpsat

default:
  batch_size:
    type: int
    default: 4
    label: Batch size
    hint: How many tubes to weigh, twice each (pass 1 for all, then pass 2 for all).
    min: 1
    max: 48
