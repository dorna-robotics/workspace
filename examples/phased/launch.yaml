# phased example — launch config.
#
# The shaker example's bench plus a balance (one amber 40 ml rack, a
# 4-seat shaker, one balance), run as TWO weigh passes over every tube
# with a shake in banks of four between them. The point is the PROJECT
# SHAPE, not the chemistry: a phased protocol whose actions live in a
# package, one module per phase, the batch regrouping at each phase
# boundary — and, in phase 2, tubes a device couples moving as a group.

project_name: phased
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions/         # a PACKAGE — actions/__init__.py + one module per phase
checks:       checks.py
phases:       phases.py        # the batch crosses each phase together — DEPTH

plan_window:  4                # WIDTH — tubes per plan/schedule cycle (phase 2 widens it to the rack)
scheduler:    cpsat

default:
  batch_size:
    type: int
    default: 4
    label: Batch size
    hint: How many tubes to weigh twice, shaken in banks of four between the passes. 8 shows the banks overlap.
    min: 1
    max: 8
