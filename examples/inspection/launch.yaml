# inspection example — launch config.
#
# Scene: SBS rack of capped 2ml tubes + a fixed inspection station
# (printer-like) + a stand-alone inspection module on the ground.
# This commit is scene-first — Start/Park scaffold only; the inspect
# workflow (pick tube → present to vision → rotate/detect → return)
# gets added next.

project_name: inspection
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat


# The project's folders — the file browser's tabs, in this order.
# key results / data / captures / rec are the platform's (run records,
# input files, the images detections keep, recordings); any other key
# is just a tab. read_only: true = browse and download only.
folders:
  - {key: results,  label: Results,    path: results,  read_only: false}
  - {key: data,     label: Data,       path: data,     read_only: false}
  - {key: captures, label: Captures,   path: captures, read_only: false}
  - {key: rec,      label: Recordings, path: rec,      read_only: false}
default:
  batch_size:
    type: int
    default: 4
    label: Batch size
    hint: How many tubes to inspect (pick → present to both stations → place).
    min: 1
    max: 48
