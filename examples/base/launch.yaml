# base example — launch config.
#
# The seed of every project: bare core_500 chassis, no devices, no
# tools. The protocol is the canonical bookend pair — Start (motor on +
# home the rail, fatal "killed" if homing fails) → Park. Copy this
# folder to start a new project, then grow layout.j2 / recipes.j2 /
# actions.py from here.

project_name: base
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat

kwargs: {}
