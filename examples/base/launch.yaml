# base example — launch config.
#
# The seed of every project: bare core_500 chassis, no devices, no
# tools. The protocol is the canonical bookend pair — Start (motor on +
# home the rail, fatal "killed" if homing fails) → Park. Copy this
# folder to start a new project, then grow layout.j2 / recipes.j2 /
# actions.py from here.

project_name: base
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

# Station-local state folder (calibrate.json, ik.json, path.json).
# Absolute, or relative to the project folder. Gitignored — per-station
# truth, never synced.
core_dir:     core

# The project's folders — the file browser's tabs, in this order.
# key results / data / captures / rec are the platform's (run records,
# input files, the images detections keep, recordings); any other key
# is just a tab. read_only: true = browse and download only.
folders:
  - {key: results,  label: Results,    path: results,  read_only: false}
  - {key: data,     label: Data,       path: data,     read_only: false}
  - {key: captures, label: Captures,   path: captures, read_only: false}
  - {key: rec,      label: Recordings, path: rec,      read_only: false}

plan_window:  4
scheduler:    cpsat

default: {}
