# shaker example — launch config.

project_name: shaker_example
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

# Window = shaker capacity: each slice loads both slots, shakes once,
# unloads both. Tube t uses slot t % 2, so slices never collide.
plan_window:  2
scheduler:    cpsat


# The project's folders — the file browser's tabs, in this order.
# key results / data / captures / rec are the platform's (run records,
# input files, the images detections keep, recordings); any other key
# is just a tab. read_only: true = browse and download only.
folders:
  - {key: results,  label: Results,    path: results,  read_only: false}
  - {key: data,     label: Data,       path: data,     read_only: false}
  - {key: captures, label: Captures,   path: captures, read_only: false}
  - {key: rec,      label: Recordings, path: rec,      read_only: false}
default:
  batch_size:
    type: int
    default: 2
    label: Batch size
    hint: Number of 40 ml tubes to load onto the shaker, shake, and return.
    min: 1
    max: 8
