# feeder example — launch config.

project_name: feeder_example
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat

kwargs:
  cap_count:
    type: int
    default: 3
    label: Cap count
    hint: Number of caps to feed from the feeder into the cap holder.
    min: 1
    max: 10
