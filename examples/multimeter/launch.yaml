# multimeter/launch.yaml — minimal demo for the multi_meter component.

project_name: multimeter    # appears in logs, tree node names, GUI
port:         5010               # default operator-UI port (env var PORT overrides)
scene:        [scene/core_500.j2, scene/layout.j2]  # core_500 chassis + BK 879B meter on plate 1
recipes:      recipes.j2         # exposes the meter as ``rcp["meter"]``
actions:      actions.py         # protocol: Start → ReadMeter(t)×batch → Park
checks:       checks.py          # empty — no vision/sensor checks needed

plan_window:  4
scheduler:    cpsat

# Operator GUI form. ``batch_size`` controls how many capacitance reads
# the run takes; each ReadMeter action waits 10 s, reads, and logs the
# value as a step the operator sees in the timeline.
kwargs:
  batch_size:
    type: int
    default: 3
    label: Batch size
    hint: Number of capacitance readings this run.
    min: 1
    max: 100
