# ph_meter example — launch config.
#
# For each of batch_size amber 40 ml vials (open, in the 1x6 rack):
# dip the Atlas pH probe in, wait for a settled reading, log the pH,
# lift clear, and rinse in the storage-solution cup. The probe is a
# tool-changer tool parked in the tool rack; the EZO circuit runs in
# sim by default (canned pH). Set port + simulation:false on
# ph_meter_atlas_1 in the layout for the real circuit.

project_name: ph_meter
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat


# The project's folders — the file browser's tabs, in this order.
# key results / data / captures / rec are the platform's (run records,
# input files, the images detections keep, recordings); any other key
# is just a tab. read_only: true = browse and download only.
folders:
  - {key: results,  label: Results,    path: results,  read_only: false}
  - {key: data,     label: Data,       path: data,     read_only: false}
  - {key: captures, label: Captures,   path: captures, read_only: false}
  - {key: rec,      label: Recordings, path: rec,      read_only: false}
default:
  batch_size:
    type: int
    default: 3
    label: Batch size
    hint: How many vials to measure (immerse -> read -> retract -> rinse).
    min: 1
    max: 6
