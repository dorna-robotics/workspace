# pipetting example — launch config.

project_name: pipetting_example
port:         5010
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat

default:
  transfer_count:
    type: int
    default: 2
    label: Transfer count
    hint: Number of pipette transfers. Source is the rack's first slot; destinations walk the rest in iteration order. Each transfer uses a fresh tip.
    min: 1
    max: 19
