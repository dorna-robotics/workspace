# 4_constraints/constraints.yaml
# Grouped states — no holding constraint needed (handled inside phase handlers).

# ── Rewards ────────────────────────────────────────────────────────────────────
rewards:
  per_step:    -1.0
  goal_state:   50.0
  completion:  200.0
  background:    5.0
  idle:          -2.0     # per second of idle time — pushes RL to fill background wait

# ── Constraints ────────────────────────────────────────────────────────────────
constraints:

  - name: current_tool
    type: enum
    observe: true
    penalty: -25.0
    options: [gripper, needle, feeder_tool, gripper_2ml]
    map:
      inspected:      gripper
      dosed_40ml:     needle
      loaded_shaker:  gripper
      shaken:         feeder_tool
      cap_fed:        feeder_tool
      retrieved:      gripper
      dosed_2ml:      needle
      recapped_final: gripper
      capped_2ml:     gripper_2ml
