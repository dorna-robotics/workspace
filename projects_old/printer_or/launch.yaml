# printer_or/launch.yaml

scene: [scene/base.j2, scene/layout.j2]

kwargs:
  batch_size:
    type: int
    default: 1
    label: Batch size
    hint: Number of tubes to process
    min: 1
    max: 10

  print_job:
    type: bool
    default: true
    label: Print labels
    hint: If false, runs dry-run spin instead of printing

  vol:
    type: int
    default: 400
    label: Pipette volume (uL)
    hint: Volume to aspirate/dispense per tube
    min: 1
    max: 1000
