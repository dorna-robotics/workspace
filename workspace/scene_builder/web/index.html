<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Scene Builder — Dorna Lab</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Apply theme before paint to avoid flash -->
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme") || "dark"); })();</script>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="style.css"/>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

<!-- ============================================================
     Header
     ============================================================ -->
<header class="sb-header">
  <div class="brand">
    <img src="https://dorna.ai/wp-content/uploads/2023/05/black-horizontal-1.svg" alt="Dorna Lab" height="26"/>
  </div>
  <span class="sb-title">Scene Builder</span>
  <div class="spacer"></div>
  <button class="btn btn-ghost btn-sm btn-icon" id="btnTheme" title="Toggle theme"></button>
</header>

<!-- ============================================================
     Body — sidebar (left) + viewer (right)
     ============================================================ -->
<div class="sb-body">

  <!-- ---- Sidebar ---- -->
  <aside class="sidebar">
    <div class="sidebar-scroll">

      <!-- Controls -->
      <div>
        <div class="section-label">Controls</div>
        <div class="sb-controls">
          <button class="btn btn-primary sb-insert-btn" id="btnInsert" title="Insert component">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Insert
          </button>
          <div class="sb-util-row">
            <button class="btn btn-sm sb-save-btn" id="btnSave" title="Save config.j2">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Save
            </button>
            <button class="btn btn-sm btn-ghost btn-icon sb-hist-btn" id="btnUndo" title="Undo (Ctrl+Z)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13A9 9 0 1 0 5.4 6.4"/></svg>
            </button>
            <button class="btn btn-sm btn-ghost btn-icon sb-hist-btn" id="btnRedo" title="Redo (Ctrl+Y)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M21 13A9 9 0 1 1 18.6 6.4"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Selection properties (shown when an object is selected) -->
      <div id="sbPropsSection" style="display:none">
        <div class="section-label">Selection</div>
        <div class="meta-list" style="margin-bottom:8px">
          <div class="meta-row">
            <span class="meta-key">Name</span>
            <span class="meta-val mono" id="sbPropName">—</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">Type</span>
            <span class="meta-val mono" id="sbPropType">—</span>
          </div>
        </div>
        <!-- Action buttons populated by JS -->
        <div class="sb-actions" id="sbActions"></div>
      </div>

      <!-- Config YAML preview -->
      <div>
        <div class="section-label">Config</div>
        <div class="sb-config-bar">
          <button class="btn btn-sm btn-ghost btn-icon" id="btnLoadConfig" title="Load config from file">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Load
          </button>
          <button class="btn btn-sm btn-ghost btn-icon" id="btnCopyConfig" title="Copy config to clipboard">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
        <pre id="sbConfigPre" class="sb-config-pre"># No components yet</pre>
      </div>

    </div>
  </aside>

  <!-- ---- Viewer area ---- -->
  <div class="viewer-area" id="viewerArea">

    <!-- Control buttons (top-right of viewer) — same as orchestrator -->
    <div id="ctrlPanel">
      <button class="ctrl-btn" id="btnGrid" title="Toggle grid">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <button class="ctrl-btn" id="btnCollision" title="Toggle collision boxes">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        </svg>
      </button>
    </div>

    <!-- ViewCube + Home button (bottom-right of viewer) -->
    <div id="viewCubeWrap">
      <div style="display:flex;justify-content:flex-end;margin-bottom:6px;">
        <button class="ctrl-btn" id="btnHome" title="Reset view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </button>
      </div>
      <canvas id="viewCubeCanvas" width="130" height="130"></canvas>
    </div>

    <!-- Info bar (bottom-left of viewer) — shown on selection -->
    <div id="infoBar">
      <span id="infoName"  class="infoLabel"></span>
      <span id="infoType"  class="infoLabel"></span>
      <span id="infoSolid" class="infoLabel"></span>
    </div>

  </div><!-- /viewer-area -->

</div><!-- /sb-body -->

<!-- Toast notifications -->
<div class="toast-area" id="toastArea"></div>

<!-- Hidden file input for loading configs (wired by app.js) -->
<input type="file" id="configFileInput" accept=".j2,.yaml,.yml" style="display:none"/>

<script type="module" src="theme.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
