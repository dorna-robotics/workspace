<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dorna Workspace</title>
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme")||"dark"); })();</script>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .main {
      padding: 28px 24px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border2);
    }
    .section-header h2 { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .section-header .count {
      font-size: 11px; font-weight: 600;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 1px 8px;
      font-family: var(--mono);
    }

    /* ---- Workspace grid ---- */
    .ws-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }

    /* ---- Workspace card ---- */
    .ws-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.18s, border-color 0.18s, transform 0.15s;
      box-shadow: inset 3px 0 0 var(--border2);
    }
    .ws-card:hover {
      border-color: var(--border);
      box-shadow: inset 3px 0 0 var(--border), 0 6px 24px rgba(0,0,0,0.4);
      transform: translateY(-1px);
    }
    .ws-card.is-running {
      box-shadow: inset 3px 0 0 var(--green), 0 0 0 1px rgba(63,185,80,0.05), 0 4px 16px rgba(0,0,0,0.25);
    }
    .ws-card.is-running:hover {
      box-shadow: inset 3px 0 0 var(--green), 0 8px 28px rgba(0,0,0,0.4);
    }
    .ws-card.is-error {
      box-shadow: inset 3px 0 0 var(--red);
    }
    .ws-card.is-error:hover {
      box-shadow: inset 3px 0 0 var(--red), 0 6px 24px rgba(0,0,0,0.4);
    }

    .wc-head {
      padding: 14px 16px 8px 18px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .wc-info { flex: 1; min-width: 0; }
    .wc-name {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .wc-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 2px 7px;
      letter-spacing: 0.4px;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .wc-path {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wc-meta {
      padding: 0 18px 12px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .wc-meta-item { font-size: 12px; display: flex; gap: 4px; align-items: center; color: var(--muted); }
    .wc-meta-item strong { font-weight: 600; color: var(--text); font-family: var(--mono); font-size: 11px; }
    .wc-err {
      font-size: 11px;
      color: var(--red);
      background: rgba(248,81,73,0.07);
      border: 1px solid rgba(248,81,73,0.22);
      border-radius: 6px;
      padding: 2px 8px;
    }

    .wc-footer {
      margin-top: auto;
      padding: 10px 14px;
      border-top: 1px solid var(--border2);
      display: flex;
      gap: 6px;
      align-items: center;
      background: var(--surface2);
    }
    .wc-actions { display: flex; gap: 5px; align-items: center; }
    .wc-starting {
      font-size: 11px; font-weight: 600; color: var(--muted);
      display: flex; align-items: center; gap: 5px;
    }
    .wc-starting::before {
      content: ""; display: inline-block; width: 9px; height: 9px;
      border: 2px solid var(--muted); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Empty state ---- */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 36px; margin-bottom: 16px; opacity: 0.15; }
    .empty-state h3 { color: var(--text); margin-bottom: 6px; font-size: 15px; font-weight: 600; }
    .empty-state p { font-size: 13px; line-height: 1.6; }

    /* ---- Search ---- */
    .ws-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .ws-search-wrap svg {
      position: absolute;
      left: 9px;
      color: var(--muted);
      pointer-events: none;
    }
    .ws-search {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 5px 10px 5px 28px;
      outline: none;
      width: 200px;
      transition: border-color 0.12s, box-shadow 0.12s, width 0.2s;
    }
    .ws-search:focus { border-color: var(--accent); box-shadow: var(--glow); width: 260px; }
    .ws-search::placeholder { color: var(--muted); }
    [data-theme="light"] .ws-search { background: #fff; border-color: var(--border); }

  </style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="https://dorna.ai/wp-content/uploads/2023/05/black-horizontal-1.svg" alt="Dorna Lab" height="26"/>
  </div>
  <span class="pill off" style="min-width:0;overflow:hidden;text-overflow:ellipsis">
    <span class="dot ok"></span>
    <span class="mono" id="orchUrl" style="overflow:hidden;text-overflow:ellipsis"></span>
  </span>
  <div class="spacer"></div>
  <button class="btn btn-primary btn-sm" id="btnAdd">+ Add Workspace</button>
  <button class="btn btn-ghost btn-sm btn-icon" id="btnFullscreen" title="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
  <button class="btn btn-ghost btn-sm btn-icon" id="btnTheme" title="Toggle theme">○</button>
</header>

<main class="main">
  <div class="stats-bar" id="statsBar">
    <div class="stat-item active" data-filter="all">
      <div class="stat-label">Total</div>
      <div class="stat-value off" id="statTotal">—</div>
    </div>
    <div class="stat-item" data-filter="running">
      <div class="stat-label">Running</div>
      <div class="stat-value ok" id="statRunning">—</div>
    </div>
    <div class="stat-item" data-filter="idle">
      <div class="stat-label">Idle</div>
      <div class="stat-value warn" id="statIdle">—</div>
    </div>
    <div class="stat-item" data-filter="error">
      <div class="stat-label">Errors</div>
      <div class="stat-value bad" id="statErrors">—</div>
    </div>
    <div class="stat-item" data-filter="offline">
      <div class="stat-label">Offline</div>
      <div class="stat-value off" id="statOffline">—</div>
    </div>
  </div>

  <div class="section-header">
    <h2>Workspaces</h2>
    <span class="count" id="wsCount"></span>
    <div class="spacer"></div>
    <div class="ws-search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="ws-search" id="wsSearch" type="text" placeholder="Search workspaces…" autocomplete="off" spellcheck="false"/>
    </div>
  </div>
  <div class="ws-grid" id="wsGrid"></div>
</main>

<div class="toast-area" id="toastArea"></div>

<!-- Add Workspace Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>Add Workspace</h3>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm btn-icon" id="btnModalClose" title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>Name *</label>
          <input class="input" id="f_name" type="text" placeholder="workflow" autocomplete="off"/>
        </div>
        <div class="field">
          <label>Label <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
          <input class="input" id="f_label" type="text" placeholder="Workflow 1"/>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Node URL <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
          <input class="input" id="f_nodeUrl" type="text" placeholder="http://10.0.0.2:5000"/>
          <div class="hint">Remote orchestrator URL. Leave empty for local.</div>
        </div>
        <div class="field">
          <label>Port *</label>
          <input class="input" id="f_port" type="number" value="5010"/>
        </div>
      </div>
      <div class="field">
        <label>Path to main.py *</label>
        <input class="input" id="f_path" type="text" placeholder="/home/dorna/.../projects/workflow/main.py"/>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnModalCancel">Cancel</button>
      <button class="btn btn-primary" id="btnModalConfirm">Add workspace</button>
    </div>
  </div>
</div>

<!-- Parameters Modal -->
<div class="modal-overlay" id="paramsModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="paramsModalTitle">Parameters</h3>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm btn-icon" id="btnParamsClose" title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="kwargs-form" id="paramsForm"></div>
    </div>
    <div class="modal-foot" id="paramsModalFoot"></div>
  </div>
</div>

<script type="module" src="theme.js"></script>
<script type="module" src="dashboard.js"></script>
</body>
</html>
