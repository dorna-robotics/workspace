<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dorna Workspace</title>
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme")||"dark"); })();</script>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* ---- Header ---- */
    .ws-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 54px;
      min-height: 54px;
      border-bottom: 1px solid var(--border2);
      background: rgba(28,28,30,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      flex-shrink: 0;
      position: relative;
      transition: border-bottom-color 0.3s;
    }
    [data-theme="light"] .ws-header { background: rgba(255,255,255,0.85); }
    .ws-header[data-state="ok"]   { border-bottom-color: var(--green); }
    .ws-header[data-state="bad"]  { border-bottom-color: var(--red); }
    .ws-header[data-state="warn"] { border-bottom-color: var(--amber); }
    .back-link {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.12s, color 0.12s;
      text-decoration: none;
      position: relative;
      z-index: 1;
    }
    .back-link:hover { background: var(--surface2); color: var(--text); }
    .vdivider { width: 1px; height: 20px; background: var(--border2); flex-shrink: 0; position: relative; z-index: 1; }
    .ws-title-block { min-width: 0; flex: 1; overflow: hidden; position: relative; z-index: 1; }
    .ws-title    { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ws-subtitle { font-size: 12px; color: var(--muted); }

    /* ---- Body ---- */
    .ws-body { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 300px;
      min-width: 300px;
      border-right: 1px solid var(--border2);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    [data-theme="light"] .sidebar { background: #fff; }
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sidebar-scroll > div + div {
      padding-top: 2px;
    }

    /* ---- Controls ---- */
    #controls { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .ctrl-starting {
      font-size: 12px; font-weight: 600; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .ctrl-starting::before {
      content: ""; display: inline-block; width: 10px; height: 10px;
      border: 2px solid var(--muted); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Step timeline ---- */
    .step-timeline {
      max-height: 130px;
      overflow-y: auto;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      padding: 6px 0;
    }
    [data-theme="light"] .step-timeline {
      background: var(--surface2);
    }
    .step-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 3px 12px 3px 12px;
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--muted);
      position: relative;
      opacity: 0.45;
      transition: opacity 0.25s;
    }
    .step-card.active {
      color: var(--text);
      opacity: 1;
    }
    /* Vertical connector line */
    .step-card:not(:last-child) .step-dot-wrap::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 1.5px;
      height: calc(100% + 6px);
      background: var(--border2);
      transform: translateX(-50%);
    }
    .step-dot-wrap {
      position: relative;
      flex-shrink: 0;
      width: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 2px;
    }
    .step-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.4;
      transition: all 0.25s;
    }
    /* Active dot — pulsing glow, color matches level */
    .step-card.active .step-dot {
      width: 8px; height: 8px; opacity: 1;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent), 0 0 3px var(--accent);
    }
    .step-card.active[data-level="success"] .step-dot { background: var(--green); box-shadow: 0 0 8px var(--green), 0 0 3px var(--green); }
    .step-card.active[data-level="warning"] .step-dot { background: var(--amber); box-shadow: 0 0 8px var(--amber), 0 0 3px var(--amber); }
    .step-card.active[data-level="error"]   .step-dot { background: var(--red);   box-shadow: 0 0 8px var(--red),   0 0 3px var(--red); }

    /* Done dot — solid, color matches level */
    .step-card.done .step-dot { background: var(--muted); opacity: 0.6; }
    .step-card.done[data-level="success"] .step-dot { background: var(--green); opacity: 0.85; }
    .step-card.done[data-level="warning"] .step-dot { background: var(--amber); opacity: 0.85; }
    .step-card.done[data-level="error"]   .step-dot { background: var(--red);   opacity: 0.85; }

    /* Text color for warning/error */
    .step-card[data-level="warning"] .step-text { color: var(--amber); }
    .step-card[data-level="error"]   .step-text { color: var(--red); }

    .step-text {
      flex: 1;
      min-width: 0;
    }
    .step-empty {
      padding: 10px 12px;
      font-size: 11px;
      color: var(--muted2);
      text-align: center;
    }
    .step-card.active .step-text {
      font-weight: 600;
    }
    /* Badge next to header */
    .step-count-badge:empty { display: none; }
    .step-count-badge {
      font-size: 11px;
      font-weight: 600;
      font-family: var(--mono);
      color: var(--accent);
      background: var(--accent-dim);
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    /* ---- Logs ---- */
    .log-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; cursor: pointer; user-select: none; }
    .log-header .section-label { margin: 0; }
    .log-header .btn { cursor: pointer; }
    #logChevron.open, #stepChevron.open, #paramsChevron.open { transform: rotate(90deg); }

    .params-pre {
      background: var(--bg);
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.65;
      overflow-y: auto;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      flex-shrink: 0;
      user-select: text;
      cursor: text;
    }
    [data-theme="light"] .params-pre { background: var(--surface2); }

    #logPre {
      background: var(--bg);
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.65;
      overflow-y: auto;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      height: 280px;
      flex-shrink: 0;
      user-select: text;
      cursor: text;
    }
    [data-theme="light"] #logPre { background: var(--surface2); color: var(--muted); }

    /* ---- 3D Viewer area ---- */
    .viewer-area {
      flex: 1;
      position: relative;
      background: #000;
      min-width: 0;
      overflow: hidden;
    }
    [data-theme="light"] .viewer-area { background: #f2f2f7; }
    #ws3dFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .viewer-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 10px;
      pointer-events: none;
    }
    .ph-icon { font-size: 48px; opacity: 0.3; margin-bottom: 4px; }
    .viewer-placeholder h3 { font-size: 14px; color: var(--muted); font-weight: 500; }
    .viewer-placeholder p  { font-size: 12px; }

    /* ---- Mobile ---- */
    @media (max-width: 768px) {
      html, body { height: auto; overflow: auto; }
      .ws-header { gap: 8px; padding: 0 10px; }
      .back-link { font-size: 11px; padding: 4px 6px; }
      .vdivider { display: none; }
      .ws-title { font-size: 12px; }
      .ws-subtitle { font-size: 10px; }

      .ws-body { flex-direction: column; flex: none; overflow: visible; }
      .sidebar { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid var(--border2); flex: none; overflow: visible; }
      .sidebar-scroll { overflow: visible; }
      .viewer-area { flex: none; height: 60vh; }

      #controls { gap: 6px; }
      #controls .btn { font-size: 12px; padding: 8px 12px; min-height: 36px; }

      #logPre { height: 200px; font-size: 10px; overflow-y: auto; }
    }

    @media (max-width: 480px) {
      .ws-header { height: 44px; min-height: 44px; }
      .sidebar-scroll { padding: 10px; gap: 14px; }
      .meta-row { font-size: 11px; padding: 6px 10px; }
      .meta-val { max-width: 140px; font-size: 11px; }
      .meta-val.path { font-size: 9px; }
    }

  </style>
</head>
<body>

<div class="alarm-banner" id="alarmBanner" style="display:none">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  <span id="alarmText">Robot alarm</span>
  <button class="alarm-dismiss" id="alarmDismiss" title="Dismiss">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>

<header class="ws-header">
  <a href="index.html" class="back-link">← Workspaces</a>
  <div class="vdivider"></div>
  <div class="ws-title-block">
    <div class="ws-title" id="wsName">—</div>
    <div class="ws-subtitle" id="wsLabel"></div>
  </div>
  <span class="pill off" id="statePill"><span class="dot"></span>—</span>
  <div class="spacer"></div>
  <button class="btn btn-ghost btn-sm btn-icon" id="btnFullscreen" title="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
  <button class="btn btn-ghost btn-sm btn-icon" id="btnTheme" title="Toggle theme">○</button>
  <button class="btn btn-ghost btn-sm btn-icon" id="btnPendant" title="Pendant mode"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><line x1="12" y1="3" x2="12" y2="7"/></svg></button>
</header>

<div class="ws-body">

  <aside class="sidebar">
    <div class="sidebar-scroll">

      <div>
        <div class="section-label">Controls</div>
        <div id="controls"></div>
      </div>

      <div>
        <div class="section-label">Status</div>
        <div class="meta-list">
          <div class="meta-row">
            <span class="meta-key">Uptime</span>
            <span class="meta-val mono" id="uptimeVal">—</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">Started</span>
            <span class="meta-val mono" id="startedVal">—</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">URL</span>
            <span class="meta-val path mono" id="urlVal" title="">—</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">Path</span>
            <span class="meta-val path mono" id="pathVal" title="">—</span>
          </div>
          <div class="meta-row" id="lastErrRow" style="display:none">
            <span class="meta-key">Last error</span>
            <span class="meta-val err" id="lastErrVal">—</span>
          </div>
        </div>
      </div>

      <div id="paramsSection">
        <div class="log-header" id="btnToggleParams" title="Toggle parameters">
          <div class="section-label">Run Parameters</div>
          <svg id="paramsChevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.2s;opacity:0.45;flex-shrink:0"><polyline points="9 18 15 12 9 6"/></svg>
          <div class="spacer"></div>
          <button class="btn btn-ghost btn-sm btn-icon" id="btnCopyParams" title="Copy parameters"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
        <pre id="paramsPre" style="display:none" class="params-pre">(no parameters)</pre>
      </div>

      <div id="progressSection" style="display:none">
        <div class="section-label">Progress</div>
        <div class="sidebar-progress">
          <div class="progress-bar">
            <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
          </div>
          <span id="progressLabel">0%</span>
        </div>
      </div>

      <div id="stepSection">
        <div class="log-header" id="btnToggleSteps" title="Toggle progress">
          <div class="section-label">Steps</div>
          <svg id="stepChevron" class="open" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.2s;opacity:0.45;flex-shrink:0"><polyline points="9 18 15 12 9 6"/></svg>
          <div class="spacer"></div>
          <span class="step-count-badge" id="stepCountBadge"></span>
          <button class="btn btn-ghost btn-sm btn-icon" id="btnCopySteps" title="Copy steps"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
        <div id="stepTimeline" class="step-timeline"><div class="step-empty">No steps yet</div></div>
      </div>

      <div>
        <div class="log-header" id="btnToggleLogs" title="Expand logs">
          <div class="section-label">Logs</div>
          <svg id="logChevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.2s;opacity:0.45;flex-shrink:0"><polyline points="9 18 15 12 9 6"/></svg>
          <div class="spacer"></div>
          <button class="btn btn-ghost btn-sm btn-icon" id="btnFollowLogs" title="Jump to latest" style="display:none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></button>
          <button class="btn btn-ghost btn-sm btn-icon" id="btnCopyLogs" title="Copy logs"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
          <button class="btn btn-ghost btn-sm btn-icon" id="btnRefreshLogs" title="Refresh logs"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
          <button class="btn btn-ghost btn-sm btn-icon" id="btnClearLogs" title="Clear logs"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <pre id="logPre" style="display:none">(loading...)</pre>
      </div>

    </div>
  </aside>

  <div class="viewer-area">
    <iframe id="ws3dFrame" src="about:blank"></iframe>
    <div class="viewer-placeholder" id="viewerPlaceholder">
      <div class="ph-icon">⬡</div>
      <h3>3D Viewer</h3>
      <p>Launch the workspace to load the simulation.</p>
    </div>
  </div>

</div>

<!-- Pendant mode overlay -->
<div class="pendant-overlay" id="pendantOverlay" style="display:none">
  <div class="pendant-state" id="pendantState">
    <span class="pendant-dot"></span>
    <span class="pendant-state-text">—</span>
  </div>
  <div class="pendant-alarm" id="pendantAlarm" style="display:none">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span id="pendantAlarmText">Robot alarm</span>
  </div>
  <div class="pendant-info" id="pendantInfo">
    <div class="pendant-steps" id="pendantSteps"></div>
    <div class="pendant-progress" id="pendantProgress" style="display:none">
      <div class="progress-bar">
        <div class="progress-bar-fill" id="pendantProgressFill" style="width:0%"></div>
      </div>
      <span id="pendantProgressLabel">0%</span>
    </div>
  </div>
  <div class="pendant-buttons">
    <button class="pendant-btn pendant-start"   id="pendantStart"   data-cmd="start">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span>Start</span>
    </button>
    <button class="pendant-btn pendant-pause"   id="pendantPause"   data-cmd="pause">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      <span>Pause</span>
    </button>
    <button class="pendant-btn pendant-relaunch" id="pendantRelaunch" data-cmd="relaunch">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      <span>Restart</span>
    </button>
    <button class="pendant-btn pendant-kill"    id="pendantKill"    data-cmd="kill">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <span>Kill</span>
    </button>
  </div>
  <button class="pendant-exit" id="pendantExit">✕ Exit Pendant</button>
  <button class="pendant-secondary" id="pendantParams" style="position:fixed;top:16px;left:50%;transform:translateX(-50%)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Parameters
  </button>
</div>

<!-- Parameters Modal -->
<div class="modal-overlay" id="paramsModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="paramsModalTitle">Parameters</h3>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm btn-icon" id="btnParamsClose" title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
