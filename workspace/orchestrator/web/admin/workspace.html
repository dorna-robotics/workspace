<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dorna Workspace</title>
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme")||"dark"); })();</script>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* ---- Header ---- */
    .ws-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      height: 52px;
      min-height: 52px;
      border-bottom: 1px solid var(--border2);
      background: var(--surface);
      flex-shrink: 0;
      position: relative;
      transition: border-bottom-color 0.3s;
      box-shadow: 0 1px 0 var(--border2), 0 4px 20px rgba(0,0,0,0.25);
    }
    .ws-header[data-state="ok"]   { border-bottom-color: var(--green); }
    .ws-header[data-state="bad"]  { border-bottom-color: var(--red); }
    .ws-header[data-state="warn"] { border-bottom-color: var(--amber); }
    .back-link {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 6px;
      transition: background 0.1s, color 0.1s;
      text-decoration: none;
      position: relative;
      z-index: 1;
    }
    .back-link:hover { background: var(--surface2); color: var(--text); }
    .vdivider { width: 1px; height: 20px; background: var(--border2); flex-shrink: 0; position: relative; z-index: 1; }
    .ws-title-block { min-width: 0; flex: 1; overflow: hidden; position: relative; z-index: 1; }
    .ws-title    { font-size: 14px; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ws-subtitle { font-size: 11px; color: var(--muted); }

    /* ---- Body ---- */
    .ws-body { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 300px;
      min-width: 300px;
      border-right: 1px solid var(--border2);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .sidebar-scroll > div + div {
      padding-top: 4px;
      border-top: 1px solid var(--border2);
    }

    /* ---- Controls ---- */
    #controls { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .ctrl-starting {
      font-size: 12px; font-weight: 600; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .ctrl-starting::before {
      content: ""; display: inline-block; width: 10px; height: 10px;
      border: 2px solid var(--muted); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Logs ---- */
    .log-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; user-select: none; }
    .log-header .section-label { margin: 0; }
    .log-header .btn { cursor: pointer; }
    #logChevron.open { transform: rotate(90deg); }

    #logPre {
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.65;
      overflow-y: auto;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      height: 280px;
      flex-shrink: 0;
      box-shadow: inset 0 1px 6px rgba(0,0,0,0.25);
      user-select: text;
      cursor: text;
    }
    [data-theme="light"] #logPre { background: #f4f7fd; color: var(--muted); box-shadow: inset 0 1px 4px rgba(0,0,0,0.04); }

    /* ---- 3D Viewer area ---- */
    .viewer-area {
      flex: 1;
      position: relative;
      background: #06080e;
      min-width: 0;
      overflow: hidden;
    }
    [data-theme="light"] .viewer-area { background: #edf0f8; }
    #ws3dFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .viewer-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 10px;
      pointer-events: none;
    }
    .ph-icon { font-size: 48px; opacity: 0.12; margin-bottom: 4px; }
    .viewer-placeholder h3 { font-size: 14px; color: var(--muted); font-weight: 500; }
    .viewer-placeholder p  { font-size: 12px; }

    /* ---- Mobile ---- */
    @media (max-width: 768px) {
      html, body { height: auto; overflow: auto; }
      .ws-header { gap: 8px; padding: 0 10px; }
      .back-link { font-size: 11px; padding: 4px 6px; }
      .vdivider { display: none; }
      .ws-title { font-size: 12px; }
      .ws-subtitle { font-size: 10px; }

      .ws-body { flex-direction: column; flex: none; overflow: visible; }
      .sidebar { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid var(--border2); flex: none; overflow: visible; }
      .sidebar-scroll { overflow: visible; }
      .viewer-area { flex: none; height: 60vh; }

      #controls { gap: 4px; }
      #controls .btn { font-size: 10px; padding: 3px 8px; }

      #logPre { height: 200px; font-size: 10px; overflow-y: auto; }
    }

    @media (max-width: 480px) {
      .ws-header { height: 44px; min-height: 44px; }
      .sidebar-scroll { padding: 10px; gap: 14px; }
      .meta-row { font-size: 11px; padding: 6px 10px; }
      .meta-val { max-width: 140px; font-size: 11px; }
      .meta-val.path { font-size: 9px; }
    }
  </style>
</head>
<body>

<header class="ws-header">
  <a href="index.html" class="back-link">← Workspaces</a>
  <div class="vdivider"></div>
  <div class="ws-title-block">
    <div class="ws-title" id="wsName">—</div>
    <div class="ws-subtitle" id="wsLabel"></div>
  </div>
  <span class="pill off" id="statePill"><span class="dot"></span>—</span>
  <div class="spacer"></div>
  <button class="btn btn-ghost btn-sm btn-icon" id="btnTheme" title="Toggle theme">○</button>
  <button class="btn btn-ghost btn-sm btn-icon" id="btnPendant" title="Pendant mode"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><line x1="12" y1="3" x2="12" y2="7"/></svg></button>
</header>

<div class="ws-body">

  <aside class="sidebar">
    <div class="sidebar-scroll">

      <div>
        <div class="section-label">Controls</div>
        <div id="controls"></div>
      </div>

      <div>
        <div class="section-label">Status</div>
        <div class="meta-list">
          <div class="meta-row">
            <span class="meta-key">Uptime</span>
            <span class="meta-val mono" id="uptimeVal">—</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">Started</span>
            <span class="meta-val mono" id="startedVal">—</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">URL</span>
            <span class="meta-val path mono" id="urlVal" title="">—</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">Path</span>
            <span class="meta-val path mono" id="pathVal" title="">—</span>
          </div>
          <div class="meta-row" id="lastErrRow" style="display:none">
            <span class="meta-key">Last error</span>
            <span class="meta-val err" id="lastErrVal">—</span>
          </div>
        </div>
      </div>

      <div>
        <div class="log-header" id="btnToggleLogs" title="Expand logs">
          <div class="section-label">Logs</div>
          <svg id="logChevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.2s;opacity:0.45;flex-shrink:0"><polyline points="9 18 15 12 9 6"/></svg>
          <div class="spacer"></div>
          <button class="btn btn-ghost btn-sm btn-icon" id="btnFollowLogs" title="Jump to latest" style="display:none">↓</button>
          <button class="btn btn-ghost btn-sm btn-icon" id="btnRefreshLogs" title="Refresh logs">↺</button>
          <button class="btn btn-ghost btn-sm btn-icon" id="btnClearLogs" title="Clear logs">✕</button>
        </div>
        <pre id="logPre" style="display:none">(loading...)</pre>
      </div>

    </div>
  </aside>

  <div class="viewer-area">
    <iframe id="ws3dFrame" src="about:blank"></iframe>
    <div class="viewer-placeholder" id="viewerPlaceholder">
      <div class="ph-icon">⬡</div>
      <h3>3D Viewer</h3>
      <p>Launch the workspace to load the simulation.</p>
    </div>
  </div>

</div>

<!-- Pendant mode overlay -->
<div class="pendant-overlay" id="pendantOverlay" style="display:none">
  <div class="pendant-state" id="pendantState">
    <span class="pendant-dot"></span>
    <span class="pendant-state-text">—</span>
  </div>
  <div class="pendant-buttons">
    <button class="pendant-btn pendant-start"   id="pendantStart"   data-cmd="start">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span>Start</span>
    </button>
    <button class="pendant-btn pendant-pause"   id="pendantPause"   data-cmd="pause">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      <span>Pause</span>
    </button>
    <button class="pendant-btn pendant-relaunch" id="pendantRelaunch" data-cmd="relaunch">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      <span>Relaunch</span>
    </button>
    <button class="pendant-btn pendant-kill"    id="pendantKill"    data-cmd="kill">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <span>Kill</span>
    </button>
  </div>
  <button class="pendant-exit" id="pendantExit">✕ Exit Pendant</button>
</div>

<div class="toast-area" id="toastArea"></div>

<script type="module" src="theme.js"></script>
<script type="module" src="workspace.js"></script>
</body>
</html>
