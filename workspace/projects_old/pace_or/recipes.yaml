# recipes/recipes.yaml
# Maps recipe aliases → class + kwargs passed to the constructor.
# Aliases are referenced in workflow.py.
# component names (e.g. tool_rack_144mm_1) come from scene/base.j2.
#
# speed_factor is injected at runtime from params.yaml.

gripper:
  class: workspace.recipes.tool_rack.ToolRack
  kwargs: {component: tool_rack_144mm_1, left_approach: true}

gripper_2ml:
  class: workspace.recipes.tool_rack.ToolRack
  kwargs: {component: tool_rack_144mm_2, left_approach: true}

