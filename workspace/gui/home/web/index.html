<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dorna Workspace</title>
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme")||"light"); })();</script>
  <link rel="icon" type="image/png" href="/vendor/favicon.png"/>
  <link rel="stylesheet" href="/vendor/base.css"/>
  <link rel="stylesheet" href="/vendor/nav.css"/>
  <link rel="stylesheet" href="/orchestrator/style.css"/>
  <link rel="stylesheet" href="/home/home.css"/>
</head>
<body>
  <header class="topbar">
    <h1 class="topbar-title">Workspace</h1>
    <div class="spacer"></div>
    <div class="topbar-actions">
      <!-- vendor/nav.js mounts the Updates button (version, the unit's upgrade) here -->
      <div id="updatesSlot" class="updates-slot"></div>
      <button class="btn btn-ghost btn-sm btn-icon js-fullscreen-toggle" id="btnFullscreen" title="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
      <button class="btn btn-ghost btn-sm btn-icon js-theme-toggle" id="btnTheme" title="Toggle theme"></button>
      <!-- account.js (gui/account) mounts the Log in button / account icon here -->
      <div id="accountSlot" class="account-slot"></div>
    </div>
  </header>

  <main class="main">
    <div class="main-inner">
      <div class="home-head">
        <h2 class="home-title">Projects</h2>
        <span class="home-count" id="projCount"></span>
        <div class="spacer"></div>
        <button class="sq-btn" id="btnImport" title="Import a project" aria-label="Import a project" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Import</span>
        </button>
        <button class="sq-btn" id="btnNew" title="New project" aria-label="New project" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>New</span>
        </button>
      </div>
      <div class="proj-grid" id="grid"></div>
    </div>
  </main>

  <!-- Card menu (⋯ / right-click) -->
  <div class="menu" id="cardMenu" role="menu" hidden></div>

  <!-- Import -->
  <div class="modal-overlay" id="importModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Import a project</h3>
        <button class="btn btn-ghost btn-sm btn-icon" data-close title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="seg" role="tablist" id="importKinds">
          <button class="seg-btn active" data-kind="git" role="tab">GitHub link</button>
          <button class="seg-btn" data-kind="zip" role="tab">Zip file</button>
          <button class="seg-btn" data-kind="path" role="tab">Folder on this robot</button>
        </div>
        <div class="field" data-pane="git">
          <label for="imUrl">Repository link</label>
          <input class="input" id="imUrl" type="url" placeholder="https://github.com/owner/repo" autocomplete="off"/>
          <div class="hint">Cloned into the projects folder. A private repository needs this robot's read key.</div>
        </div>
        <div class="field" data-pane="zip" hidden>
          <label for="imZip">Zip of a project folder</label>
          <input class="input" id="imZip" type="file" accept=".zip,application/zip"/>
          <div class="hint">The folder holding main.py and launch.yaml, zipped.</div>
        </div>
        <div class="field" data-pane="path" hidden>
          <label for="imPath">Path on this robot</label>
          <input class="input" id="imPath" type="text" placeholder="/home/dorna/Downloads/projects/my_project" autocomplete="off"/>
          <div class="hint">The project stays where it is — it is only added to this page.</div>
        </div>
        <div class="field">
          <label for="imName">Name <span class="label-optional">(optional)</span></label>
          <input class="input" id="imName" type="text" placeholder="from the folder" autocomplete="off"/>
        </div>
        <div class="home-err" id="imErr" hidden></div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" id="imGo">Import</button>
      </div>
    </div>
  </div>

  <!-- New project -->
  <div class="modal-overlay" id="newModal">
    <div class="modal">
      <div class="modal-head">
        <h3>New project</h3>
        <button class="btn btn-ghost btn-sm btn-icon" data-close title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="chassis-pick" id="chassisPick">
          <button class="chassis-opt active" data-chassis="core_500"><b>Core 500</b><span>500 mm rail</span></button>
          <button class="chassis-opt" data-chassis="core_1000"><b>Core 1000</b><span>1000 mm rail</span></button>
        </div>
        <div class="field">
          <label for="newName">Name <span class="label-optional">(optional)</span></label>
          <input class="input" id="newName" type="text" placeholder="core500" autocomplete="off"/>
        </div>
        <div class="home-err" id="newErr" hidden></div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-primary" id="newGo">Create</button>
      </div>
    </div>
  </div>

  <!-- Delete -->
  <div class="modal-overlay" id="delModal">
    <div class="modal">
      <div class="modal-head"><h3 id="delTitle">Delete project</h3></div>
      <div class="modal-body">
        <div id="delText"></div>
        <div class="field">
          <label for="delName" id="delLabel">Type the project's name to confirm</label>
          <input class="input" id="delName" type="text" autocomplete="off" spellcheck="false"/>
        </div>
        <div class="home-err" id="delErr" hidden></div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close>Cancel</button>
        <button class="btn btn-danger" id="delGo" disabled>Delete</button>
      </div>
    </div>
  </div>

  <!-- GitHub (the Version panel, as on the project page) -->
  <div class="modal-overlay" id="verModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="verTitle">GitHub</h3>
        <button class="btn btn-ghost btn-sm btn-icon" data-close title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body" id="verBody"></div>
      <div class="modal-foot" id="verFoot"></div>
    </div>
  </div>

  <!-- Parameters -->
  <div class="modal-overlay" id="paramsModal">
    <div class="modal modal-wide">
      <div class="modal-head">
        <h3 id="paramsTitle">Parameters</h3>
        <span id="paramsRecord"></span>
        <button class="btn btn-ghost btn-sm btn-icon" data-close title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body"><div class="kwargs-form" id="paramsForm"></div></div>
      <div class="modal-foot" id="paramsFoot"></div>
    </div>
  </div>

  <script src="/vendor/theme.js"></script>
  <script src="/vendor/confirm.js"></script>
  <script type="module" src="/home/home.js"></script>
  <script src="/vendor/nav.js"></script>
  <!-- Account (Log in / usage) and the AI chat — gui/account + gui/ai.
       Missing files just 404: the page works without them. -->
  <script src="/vendor/account.js" defer></script>
  <script src="/vendor/ai_chat.js" defer></script>
</body>
</html>
