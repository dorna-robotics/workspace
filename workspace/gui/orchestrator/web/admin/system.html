<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dorna Workspace</title>
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme")||"light"); })();</script>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="/vendor/base.css"/>
  <link rel="stylesheet" href="/vendor/nav.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>


<header class="topbar">
  <a class="btn btn-ghost btn-sm btn-icon" href="/" title="Back to projects" aria-label="Back to projects"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
  <div class="msg-line" hidden></div>
  <div class="spacer"></div>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm btn-icon js-fullscreen-toggle" id="btnFullscreen" title="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
    <button class="btn btn-ghost btn-sm btn-icon js-theme-toggle" id="btnTheme" title="Toggle theme"></button>
  </div>
</header>


<main class="main">
<div class="main-inner">
  <h1 class="page-title">System</h1>
  <!-- The bench's upgrade (system.js). Every part listed here comes from
       the upgrade's own record — nothing on this page names a part. -->
  <div id="sys"><div class="sys-card"><div class="sys-head"><span>Installed</span></div><div class="sys-body"><div class="ver-busy">Loading…</div></div></div></div>
</div>
</main>


<script src="/vendor/theme.js"></script>
<script src="/vendor/confirm.js"></script>
<script type="module" src="system.js"></script>
<script src="/vendor/nav.js"></script>
<script src="/vendor/account.js"></script>
<script src="/vendor/ai_chat.js"></script>
</body>
</html>
