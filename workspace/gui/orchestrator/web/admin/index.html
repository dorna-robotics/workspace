<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dorna Workspace</title>
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme")||"dark"); })();</script>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="/vendor/nav.css"/>
  <style>
    .main {
      padding: 28px 24px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
    }
    .section-header h2 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .section-header .count {
      font-size: 12px; font-weight: 600;
      color: var(--muted);
      background: var(--surface2);
      border: none;
      border-radius: 20px;
      padding: 2px 10px;
      font-family: var(--mono);
    }

    /* ---- Workspace grid ---- */
    .ws-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    /* ---- Workspace card ---- */
    .ws-card {
      background: var(--surface);
      border: none;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s, transform 0.15s;
      box-shadow: var(--shadow-sm);
    }
    .ws-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .ws-card.is-running {
      background: linear-gradient(135deg, var(--surface) 0%, rgba(52,199,89,0.1) 100%);
      box-shadow: var(--shadow-sm), 0 0 0 1px rgba(52,199,89,0.35);
    }
    .ws-card.is-running:hover {
      box-shadow: var(--shadow), 0 0 0 1px rgba(52,199,89,0.4);
    }
    .ws-card.is-ready {
      background: linear-gradient(135deg, var(--surface) 0%, rgba(255,159,10,0.08) 100%);
      box-shadow: var(--shadow-sm), 0 0 0 1px rgba(255,159,10,0.25);
    }
    .ws-card.is-ready:hover {
      box-shadow: var(--shadow), 0 0 0 1px rgba(255,159,10,0.3);
    }
    .ws-card.is-error {
      background: linear-gradient(135deg, var(--surface) 0%, rgba(255,69,58,0.1) 100%);
      box-shadow: var(--shadow-sm), 0 0 0 1px rgba(255,69,58,0.35);
    }
    .ws-card.is-error:hover {
      box-shadow: var(--shadow), 0 0 0 1px rgba(255,69,58,0.4);
    }
    [data-theme="light"] .ws-card { box-shadow: 0 1px 6px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.08); }
    [data-theme="light"] .ws-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    [data-theme="light"] .ws-card.is-running { background: linear-gradient(135deg, #fff 0%, #f0fdf4 100%); box-shadow: 0 1px 6px rgba(0,0,0,0.06), 0 0 0 1.5px rgba(36,138,61,0.35); }
    [data-theme="light"] .ws-card.is-running:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1), 0 0 0 1.5px rgba(36,138,61,0.45); }
    [data-theme="light"] .ws-card.is-ready { background: linear-gradient(135deg, #fff 0%, #fffbeb 100%); box-shadow: 0 1px 6px rgba(0,0,0,0.06), 0 0 0 1.5px rgba(199,124,10,0.25); }
    [data-theme="light"] .ws-card.is-ready:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1), 0 0 0 1.5px rgba(199,124,10,0.35); }
    [data-theme="light"] .ws-card.is-error { background: linear-gradient(135deg, #fff 0%, #fef2f2 100%); box-shadow: 0 1px 6px rgba(0,0,0,0.06), 0 0 0 1.5px rgba(215,0,21,0.3); }
    [data-theme="light"] .ws-card.is-error:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1), 0 0 0 1.5px rgba(215,0,21,0.4); }

    .wc-head {
      padding: 16px 18px 10px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .wc-info { flex: 1; min-width: 0; }
    .wc-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .wc-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface2);
      border: none;
      border-radius: 6px;
      padding: 2px 8px;
      letter-spacing: 0.3px;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .wc-path {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wc-meta {
      padding: 0 20px 14px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
    }
    .wc-meta-item { font-size: 12px; display: flex; gap: 4px; align-items: center; color: var(--muted); }
    .wc-meta-item strong { font-weight: 500; color: var(--text); font-family: var(--mono); font-size: 12px; }
    .wc-err {
      font-size: 11px;
      color: var(--red);
      background: rgba(255,69,58,0.1);
      border: none;
      border-radius: 8px;
      padding: 3px 10px;
    }

    .wc-step-msg {
      padding: 0 20px 12px;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wc-step-msg::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      box-shadow: 0 0 8px var(--accent);
    }
    .wc-step-msg.warn { color: var(--amber); }
    .wc-step-msg.warn::before { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
    .wc-step-msg.err { color: var(--red); }
    .wc-step-msg.err::before { background: var(--red); box-shadow: 0 0 8px var(--red); }

    .wc-footer {
      margin-top: auto;
      padding: 12px 16px;
      border-top: 1px solid var(--border2);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .wc-actions { display: flex; gap: 5px; align-items: center; flex: 1; }
    .wc-starting {
      font-size: 12px; font-weight: 600; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .wc-starting::before {
      content: ""; display: inline-block; width: 10px; height: 10px;
      border: 2px solid var(--muted); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Empty state ---- */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.2; }
    .empty-state h3 { color: var(--text); margin-bottom: 6px; font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    /* ---- Search ---- */
    .ws-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .ws-search-wrap svg {
      position: absolute;
      left: 10px;
      color: var(--muted);
      pointer-events: none;
    }
    .ws-search {
      background: var(--surface2);
      border: none;
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 7px 12px 7px 30px;
      outline: none;
      width: 200px;
      transition: box-shadow 0.15s, width 0.2s;
    }
    .ws-search:focus { box-shadow: var(--glow); width: 260px; }
    .ws-search::placeholder { color: var(--muted); }
    [data-theme="light"] .ws-search { background: rgba(0,0,0,0.04); }

  </style>
</head>
<body>

<nav class="app-nav">
  <div class="app-nav-header">
    <a href="/" class="app-nav-brand"><img src="favicon.png" alt="Dorna"/><span>Dorna</span></a>
    <button class="app-nav-collapse" title="Collapse sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
  </div>
  <div class="app-nav-links">
    <a href="/orchestrator/" class="app-nav-link active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Orchestrator</span>
    </a>
    <a href="/scene-builder/" class="app-nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span>Scene Builder</span>
    </a>
  </div>
</nav>
<div class="app-nav-overlay"></div>

<header class="topbar">
  <button class="burger-btn" id="btnBurger" title="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  <span class="pill off truncate" style="min-width:0">
    <span class="dot ok"></span>
    <span class="mono truncate" id="orchUrl"></span>
  </span>
  <div class="spacer"></div>
  <button class="btn btn-primary btn-sm" id="btnAdd">+ Add Workspace</button>
  <button class="btn btn-ghost btn-sm btn-icon" id="btnFullscreen" title="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
  <button class="btn btn-ghost btn-sm btn-icon" id="btnTheme" title="Toggle theme"></button>
</header>

<main class="main">
  <div class="stats-bar" id="statsBar">
    <div class="stat-item active" data-filter="all">
      <div class="stat-label">Total</div>
      <div class="stat-value off" id="statTotal">—</div>
    </div>
    <div class="stat-item" data-filter="running">
      <div class="stat-label">Running</div>
      <div class="stat-value ok" id="statRunning">—</div>
    </div>
    <div class="stat-item" data-filter="idle">
      <div class="stat-label">Ready</div>
      <div class="stat-value warn" id="statIdle">—</div>
    </div>
    <div class="stat-item" data-filter="error">
      <div class="stat-label">Errors</div>
      <div class="stat-value bad" id="statErrors">—</div>
    </div>
    <div class="stat-item" data-filter="offline">
      <div class="stat-label">Offline</div>
      <div class="stat-value off" id="statOffline">—</div>
    </div>
  </div>

  <div class="section-header">
    <h2>Workspaces</h2>
    <span class="count" id="wsCount"></span>
    <div class="spacer"></div>
    <div class="ws-search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="ws-search" id="wsSearch" type="text" placeholder="Search workspaces…" autocomplete="off" spellcheck="false"/>
    </div>
  </div>
  <div class="ws-grid" id="wsGrid"></div>
</main>

<div class="toast-area" id="toastArea"></div>

<!-- Add Workspace Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>Add Workspace</h3>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btnLoadFile" title="Load from file"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Load</button>
      <input type="file" id="fileInput" accept=".yaml,.yml,.json" hidden/>
      <button class="btn btn-ghost btn-sm btn-icon" id="btnModalClose" title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>Name *</label>
          <input class="input" id="f_name" type="text" placeholder="workflow" autocomplete="off"/>
        </div>
        <div class="field">
          <label>Label <span class="label-optional">(optional)</span></label>
          <input class="input" id="f_label" type="text" placeholder="Workflow 1"/>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Node URL <span class="label-optional">(optional)</span></label>
          <input class="input" id="f_nodeUrl" type="text" placeholder="http://10.0.0.2:5000"/>
          <div class="hint">Leave empty for local.</div>
        </div>
        <div class="field">
          <label>Port *</label>
          <input class="input" id="f_port" type="number" value="5010"/>
        </div>
      </div>
      <div class="field">
        <label>Path to main.py *</label>
        <input class="input" id="f_path" type="text" placeholder="/home/dorna/.../projects/workflow/main.py"/>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnModalCancel">Cancel</button>
      <button class="btn btn-primary" id="btnModalConfirm">Add workspace</button>
    </div>
  </div>
</div>

<!-- Parameters Modal -->
<div class="modal-overlay" id="paramsModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="paramsModalTitle">Parameters</h3>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btnParamsLoad" title="Load from file"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Load</button>
      <button class="btn btn-ghost btn-sm btn-icon" id="btnParamsClose" title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="kwargs-form" id="paramsForm"></div>
    </div>
    <div class="modal-foot" id="paramsModalFoot"></div>
  </div>
</div>

<script type="module" src="theme.js"></script>
<script type="module" src="dashboard.js"></script>
<script src="/vendor/nav.js"></script>
</body>
</html>
