<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dorna Workspace</title>
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme")||"dark"); if(localStorage.getItem("nav_expanded")==="1")document.documentElement.classList.add("nav-expanded"); })();</script>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="/vendor/base.css"/>
  <link rel="stylesheet" href="/vendor/nav.css"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .main {
      overflow-x: hidden;
    }
    .main-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
    }
    .section-actions { margin-bottom: 12px; }
    /* Match the sidebar's .section-label rhythm — same caps, same
       tracking, no second visual identity for a "section title". */
    .section-header h2 { font-size: var(--text-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .section-header .count {
      font-size: var(--text-sm); font-weight: 600;
      color: var(--muted);
      background: var(--surface2);
      border: none;
      border-radius: 999px;
      padding: 2px 10px;
      font-family: var(--mono);
    }

    /* ---- Workspace grid ---- */
    .ws-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    /* ---- Workspace card ----
       State is communicated by a 3 px coloured rail on the left edge,
       not by tinted backgrounds. Surface stays flat ``var(--surface)``
       across every state so the cards scan as one consistent design
       language with the rest of the app instead of as four tinted
       variants. Mirrors the ``.stat-item::before`` accent pattern. */
    .ws-card {
      position: relative;
      background: var(--surface);
      border: none;
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s, transform 0.15s;
      box-shadow: var(--shadow-sm);
    }
    .ws-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--surface3);
      transition: background 0.2s;
    }
    .ws-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .ws-card:focus-visible {
      outline: none;
      box-shadow: var(--glow);
    }
    .ws-card.is-running::before { background: var(--green); box-shadow: var(--glow-ok); }
    .ws-card.is-ready::before   { background: var(--amber); box-shadow: var(--glow-warn); }
    .ws-card.is-error::before   { background: var(--red);   box-shadow: var(--glow-bad); }
    [data-theme="light"] .ws-card { box-shadow: 0 1px 6px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.08); }
    [data-theme="light"] .ws-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }

    .wc-head {
      padding: 16px 18px 10px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .wc-head-link {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex: 1;
      min-width: 0;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .wc-head-link:hover .wc-name { color: var(--accent); }
    .wc-info { flex: 1; min-width: 0; }
    .wc-name {
      font-size: var(--text-lg);
      font-weight: 600;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .wc-label {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--muted);
      background: var(--surface2);
      border: none;
      border-radius: var(--radius-xs);
      padding: 2px 8px;
      letter-spacing: 0.3px;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .wc-path {
      color: var(--muted);
      font-size: var(--text-sm);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wc-meta {
      padding: 0 20px 14px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
    }
    .wc-meta-item { font-size: var(--text-sm); display: flex; gap: 4px; align-items: center; color: var(--muted); }
    .wc-meta-item strong { font-weight: 500; color: var(--text); font-family: var(--mono); font-size: var(--text-sm); }
    .wc-err {
      font-size: var(--text-xs);
      color: var(--red);
      background: rgba(255,69,58,0.1);
      border: none;
      border-radius: var(--radius-sm);
      padding: 3px 10px;
    }

    .wc-step-msg {
      padding: 0 20px 12px;
      font-size: var(--text-sm);
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wc-step-msg::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      box-shadow: 0 0 8px var(--accent);
    }
    .wc-step-msg.warn { color: var(--amber); }
    .wc-step-msg.warn::before { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
    .wc-step-msg.err { color: var(--red); }
    .wc-step-msg.err::before { background: var(--red); box-shadow: 0 0 8px var(--red); }

    .wc-footer {
      margin-top: auto;
      padding: 12px 16px;
      border-top: 1px solid var(--border2);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .wc-actions { display: flex; gap: 5px; align-items: center; flex: 1; }
    .wc-starting {
      font-size: var(--text-sm); font-weight: 600; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .wc-starting::before {
      content: ""; display: inline-block; width: 10px; height: 10px;
      border: 2px solid var(--muted); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Empty state ----
       The first thing a brand-new operator sees. Lead with the SVG
       illustration, a one-sentence orientation, and the same Add
       Workspace CTA they'd otherwise hunt for in the top-bar. */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      min-height: 55vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: var(--space-2);
    }
    .empty-icon { color: var(--muted); opacity: 0.35; margin-bottom: var(--space-3); }
    .empty-state h3 { color: var(--text); font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.2px; }
    .empty-state p  { font-size: var(--text-md); line-height: 1.6; max-width: 360px; }
    .empty-state .empty-cta { margin-top: var(--space-4); padding: 10px 18px; }

    /* ---- Search ---- */
    .ws-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .ws-search-wrap svg {
      position: absolute;
      left: 10px;
      color: var(--muted);
      pointer-events: none;
    }
    .ws-search {
      background: var(--surface2);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font);
      font-size: var(--text-md);
      padding: 7px 12px 7px 30px;
      outline: none;
      width: 200px;
      transition: box-shadow 0.15s, width 0.2s;
    }
    .ws-search:focus { box-shadow: var(--glow); width: 260px; }
    .ws-search::placeholder { color: var(--muted); }
    [data-theme="light"] .ws-search { background: rgba(0,0,0,0.04); }

    /* Keep header items on one row even on narrow screens */
    @media (max-width: 600px) {
      .ws-search { width: 140px; }
      .ws-search:focus { width: 160px; }
    }

  </style>
</head>
<body>

<nav class="app-nav">
  <div class="app-nav-header">
    <button class="app-nav-collapse" title="Toggle sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
  </div>
  <div class="app-nav-links">
    <a href="/" class="app-nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="/orchestrator/" class="app-nav-link active" data-orch-link>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Orchestrator</span>
      <span class="app-nav-badge" id="navOrchCount" hidden></span>
    </a>
    <a href="/scene-builder/" class="app-nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span>Scene Builder</span>
    </a>
  </div>
</nav>
<div class="app-nav-overlay"></div>

<header class="topbar">
  <button class="burger-btn" id="btnBurger" title="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  <div class="spacer"></div>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm btn-icon" id="btnFullscreen" title="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
    <button class="btn btn-ghost btn-sm btn-icon" id="btnTheme" title="Toggle theme"></button>
  </div>
</header>

<main class="main">
<div class="main-inner">
  <div class="stats-bar" id="statsBar">
    <div class="stat-item active" data-filter="all">
      <div class="stat-label">Total</div>
      <div class="stat-value off" id="statTotal">—</div>
    </div>
    <div class="stat-item" data-filter="running">
      <div class="stat-label">Running</div>
      <div class="stat-value ok" id="statRunning">—</div>
    </div>
    <div class="stat-item" data-filter="idle">
      <div class="stat-label">Ready</div>
      <div class="stat-value warn" id="statIdle">—</div>
    </div>
    <div class="stat-item" data-filter="error">
      <div class="stat-label">Errors</div>
      <div class="stat-value bad" id="statErrors">—</div>
    </div>
    <div class="stat-item" data-filter="offline">
      <div class="stat-label">Offline</div>
      <div class="stat-value off" id="statOffline">—</div>
    </div>
  </div>

  <div class="section-actions">
    <button class="btn btn-primary btn-lg" id="btnAdd" title="Add workspace">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Workspace
    </button>
  </div>
  <div class="section-header">
    <h2>Workspaces</h2>
    <span class="count" id="wsCount"></span>
    <div class="spacer"></div>
    <div class="ws-search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="ws-search" id="wsSearch" type="text" placeholder="Search workspaces…" autocomplete="off" spellcheck="false"/>
    </div>
  </div>
  <div class="ws-grid" id="wsGrid"></div>
</div>
</main>

<div class="toast-area" id="toastArea"></div>

<!-- Add Workspace Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>Add Workspace</h3>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btnLoadFile" title="Load from file"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Load</button>
      <input type="file" id="fileInput" accept=".yaml,.yml,.json" hidden/>
      <button class="btn btn-ghost btn-sm btn-icon" id="btnModalClose" title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>Name *</label>
          <input class="input" id="f_name" type="text" placeholder="workflow" autocomplete="off"/>
        </div>
        <div class="field">
          <label>Label <span class="label-optional">(optional)</span></label>
          <input class="input" id="f_label" type="text" placeholder="Workflow 1"/>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Node URL <span class="label-optional">(optional)</span></label>
          <input class="input" id="f_nodeUrl" type="text" placeholder="http://10.0.0.2:5000"/>
          <div class="hint">Leave empty for local.</div>
        </div>
        <div class="field">
          <label>Port *</label>
          <input class="input" id="f_port" type="number" value="5010"/>
        </div>
      </div>
      <div class="field">
        <label>Path to main.py *</label>
        <input class="input" id="f_path" type="text" placeholder="/home/dorna/.../projects/workflow/main.py"/>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnModalCancel">Cancel</button>
      <button class="btn btn-primary" id="btnModalConfirm">Add workspace</button>
    </div>
  </div>
</div>

<!-- Parameters Modal -->
<div class="modal-overlay" id="paramsModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="paramsModalTitle">Parameters</h3>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btnParamsLoad" title="Load from file"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Load</button>
      <button class="btn btn-ghost btn-sm btn-icon" id="btnParamsClose" title="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="kwargs-form" id="paramsForm"></div>
    </div>
    <div class="modal-foot" id="paramsModalFoot"></div>
  </div>
</div>

<script src="/vendor/theme.js"></script>
<script src="/vendor/confirm.js"></script>
<script type="module" src="dashboard.js"></script>
<script src="/vendor/nav.js"></script>
</body>
</html>
