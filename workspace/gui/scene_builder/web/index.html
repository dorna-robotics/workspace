<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Scene Builder — Dorna Lab</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Apply theme before paint to avoid flash -->
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme")||"light"); if(localStorage.getItem("nav_expanded")==="1")document.documentElement.classList.add("nav-expanded"); })();</script>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="/vendor/base.css"/>
  <link rel="stylesheet" href="/vendor/nav.css"/>
  <link rel="stylesheet" href="style.css"/>
  <script>(function(){var w=parseInt(localStorage.getItem("sb_sidebar_w")||"",10);if(isFinite(w)){w=Math.max(220,Math.min(560,w));document.documentElement.style.setProperty("--sbw",w+"px");}})();</script>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "/vendor/three-addons/OrbitControls.js",
      "three/addons/loaders/GLTFLoader.js": "/vendor/three-addons/GLTFLoader.js",
      "three/addons/loaders/RGBELoader.js": "/vendor/three-addons/RGBELoader.js",
      "three/addons/loaders/DRACOLoader.js": "/vendor/three-addons/DRACOLoader.js"
    }
  }
  </script>
</head>
<body>

<!-- ============================================================
     Header
     ============================================================ -->
<nav class="app-nav">
  <div class="app-nav-header">
    <button class="app-nav-collapse" title="Toggle sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
  </div>
  <div class="app-nav-links">
    <a href="/" class="app-nav-link" title="Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="/orchestrator/" class="app-nav-link" title="Orchestrator" data-orch-link>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Orchestrator</span>
      <span class="app-nav-badge" id="navOrchCount" hidden></span>
    </a>
  </div>
</nav>
<div class="app-nav-overlay"></div>

<header class="sb-header">
  <button class="burger-btn" id="btnBurger" title="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  <span class="sb-head-title" id="sbHeadTitle">Scene Builder</span>
  <span class="ctrl-starting" id="sbLoadStatus" style="display:none;"></span>
  <div class="spacer"></div>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm btn-icon js-fullscreen-toggle" id="btnFullscreen" title="Fullscreen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
    <button class="btn btn-ghost btn-sm btn-icon js-theme-toggle" id="btnTheme" title="Toggle theme"></button>
  </div>
</header>

<!-- ============================================================
     Body — sidebar (left) + viewer (right)
     ============================================================ -->
<div class="sb-body">

  <!-- ---- Sidebar ---- -->
  <aside class="sidebar">
    <div class="sb-resize-handle" id="sbResizeHandle" title="Drag to resize panel"></div>
    <!-- Panel rail: Scene (build), Recipes, Replay — one pane at a
         time. Vertical icon rail, same grammar as the app nav. -->
    <div class="sb-rail" id="sbTabs">
      <button data-tab="scene" class="active" title="Scene">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span>Scene</span>
      </button>
      <button data-tab="recipes" title="Recipes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6.6L4.7 19a2 2 0 0 0 1.8 3h11a2 2 0 0 0 1.8-3L14 9.6V3"/><line x1="7" y1="15" x2="17" y2="15"/></svg>
        <span>Recipes</span>
      </button>
      <button data-tab="replay" title="Replay">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="10 8 16 12 10 16" fill="currentColor" stroke="none"/></svg>
        <span>Replay</span>
      </button>
    </div>
    <div class="sidebar-scroll">

      <!-- Controls -->
      <div data-sbtab="scene">
        <div class="section-label">Controls</div>
        <div class="sb-controls">
          <div class="sb-insert-row">
            <button class="btn btn-primary btn-lg sb-insert-btn" id="btnInsert" title="Insert component">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Insert
            </button>
            <button class="btn btn-sm btn-ghost btn-icon" id="btnNew" title="New scene">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            </button>
          </div>
          <div class="sb-util-row">
            <button class="btn btn-sm btn-ghost btn-icon sb-hist-btn" id="btnUndo" title="Undo (Ctrl+Z)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13A9 9 0 1 0 5.4 6.4"/></svg>
            </button>
            <button class="btn btn-sm btn-ghost btn-icon sb-hist-btn" id="btnRedo" title="Redo (Ctrl+Y)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M21 13A9 9 0 1 1 18.6 6.4"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Object list with search -->
      <div data-sbtab="scene">
        <div class="section-label">Objects</div>
        <input type="text" id="sbObjectSearch" class="sb-object-search" placeholder="Search objects…">
        <button id="sbShowAll" class="sb-show-all-btn" style="display:none">Show all hidden</button>
        <div id="sbObjectList" class="sb-object-list"></div>
      </div>

      <!-- Selection properties (shown when an object is selected) -->
      <div id="sbPropsSection" data-sbtab="scene" style="display:none">
        <div class="section-label">Selection</div>
        <div class="meta-list" style="margin-bottom:8px">
          <div class="meta-row">
            <span class="meta-key">Name</span>
            <span class="meta-val mono" id="sbPropName">—</span>
          </div>
          <div class="meta-row">
            <span class="meta-key">Type</span>
            <span class="meta-val mono" id="sbPropType">—</span>
          </div>
        </div>
        <!-- Action buttons populated by JS -->
        <div class="sb-actions" id="sbActions"></div>
      </div>

      <!-- Config YAML preview -->
      <div data-sbtab="scene">
        <div class="section-label">Config
          <div class="spacer"></div>
          <button class="btn btn-sm btn-ghost btn-icon" id="btnSave" title="Download"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
          <button class="btn btn-sm btn-ghost btn-icon" id="btnLoadConfig" title="Upload"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
          <button class="btn btn-sm btn-ghost btn-icon" id="btnCopyConfig" title="Copy"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
        <!-- Files list: each row is a file. The selected one is the
             active target — new components get written there. -->
        <div id="sbFilesList" class="sb-files-list"></div>
        <!-- Preview scope: the merged config of every file, or only the
             selected file's items. -->
        <div class="sb-scope-toggle">
          <button id="sbScopeAll" class="active" title="Show the merged config from every file">all configs</button>
          <button id="sbScopeFile" title="Show only the selected file's items">selected config</button>
        </div>
        <pre id="sbConfigPre" class="sb-config-pre"># No components yet</pre>
      </div>

      <!-- Project recipes: listed from the project's recipes.j2; click a
           recipe to solve its reference joints (the same solve its
           __init__ runs at boot) and pose the robot there. -->
      <div id="sbRecipesSection" data-sbtab="recipes" style="display:none;">
        <div class="section-label">Recipes</div>
        <div id="sbRecipesList" class="sb-files-list"></div>
      </div>
      <div id="sbRecipesEmpty" data-sbtab="recipes" class="rp-hint" style="padding:10px 12px">
        Load a project to list its recipes.
      </div>

      <!-- Replay: recordings captured by the notebook viewer's record
           button (<project>/core/replay_*.jsonl). Pick one (or paste a
           path) and scrub the whole run in the canvas. -->
      <div id="sbReplaySection" data-sbtab="replay">
        <div class="section-label">Replay
          <button class="btn btn-sm btn-ghost btn-icon" id="rpRefresh" title="Rescan project recordings"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
        </div>
        <div class="rp-controls">
          <select class="input" id="rpList"></select>
          <input class="input" id="rpPath" type="text" spellcheck="false"
                 placeholder="…or full path to a replay_*.jsonl"/>
          <button class="btn btn-sm btn-primary" id="rpLoad">Load</button>
          <div id="rpHint" class="rp-hint"></div>
        </div>
      </div>

    </div>
  </aside>

  <!-- ---- Viewer area ---- -->
  <div class="viewer-area" id="viewerArea">

    <!-- Control buttons (top-right of viewer) — same as orchestrator -->
    <div id="ctrlPanel">
      <button class="ctrl-btn" id="btnGrid" title="Toggle grid">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <button class="ctrl-btn" id="btnCollision" title="Toggle collision boxes">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="btnEdges" title="Toggle edge outlines">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="8.5" x2="22" y2="8.5"/><line x1="2" y1="15.5" x2="22" y2="15.5"/>
        </svg>
      </button>
    </div>

    <!-- ViewCube + Home button (bottom-right of viewer) -->
    <div id="viewCubeWrap">
      <div style="display:flex;justify-content:flex-end;margin-bottom:6px;">
        <button class="ctrl-btn" id="btnHome" title="Reset view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </button>
      </div>
      <canvas id="viewCubeCanvas" width="130" height="130"></canvas>
    </div>

    <!-- Info bar (bottom-left of viewer) — shown on selection -->
    <div id="infoBar">
      <span id="infoName"  class="infoLabel"></span>
      <span id="infoType"  class="infoLabel"></span>
      <span id="infoSolid" class="infoLabel"></span>
    </div>

    <!-- Replay player (bottom-center) — visible while a recording is
         loaded. The builder scene hides underneath; ✕ restores it. -->
    <div id="rpBar" style="display:none">
      <div class="rp-head">
        <span id="rpName" class="rp-name" title=""></span>
        <div class="rp-speeds" id="rpSpeeds" title="Playback speed">
          <button data-speed="0.5">0.5×</button>
          <button data-speed="1" class="active">1×</button>
          <button data-speed="2">2×</button>
          <button data-speed="4">4×</button>
        </div>
        <button class="rp-x" id="rpClose" title="Close replay">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="rp-row">
        <button class="rp-play" id="rpPlay" title="Play / pause (space)">
          <svg id="rpIconPlay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20"/></svg>
          <svg id="rpIconPause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
        </button>
        <input type="range" id="rpSlider" min="0" max="1000" value="0" step="1"/>
        <span id="rpTime">00:00&thinsp;/&thinsp;00:00</span>
      </div>
    </div>

  </div><!-- /viewer-area -->

</div><!-- /sb-body -->

<!-- Toast notifications -->
<div class="toast-area" id="toastArea"></div>

<!-- Hidden file input for loading configs (wired by app.js) -->
<input type="file" id="configFileInput" accept=".j2,.yaml,.yml" style="display:none"/>

<script src="/vendor/theme.js"></script>
<script src="/vendor/confirm.js"></script>
<script type="module" src="app.js"></script>
<script src="/vendor/nav.js"></script>

</body>
</html>
