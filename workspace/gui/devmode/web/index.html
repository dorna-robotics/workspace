<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Developer mode</title>
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme")||"light"); })();</script>
  <link rel="icon" type="image/png" href="/vendor/favicon.png"/>
  <link rel="stylesheet" href="/vendor/base.css"/>
  <link rel="stylesheet" href="/vendor/nav.css"/>
  <link rel="stylesheet" href="/vendor/account.css"/>
  <link rel="stylesheet" href="/vendor/ai_chat.css"/>
  <link rel="stylesheet" href="/dev/dev.css"/>
</head>
<body>


<div class="dv-shell">
  <header class="topbar dv-top">
    <a class="btn btn-ghost btn-sm btn-icon" href="/" title="Back to projects"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
    <div class="dv-title"><span class="dv-kicker">Developer mode</span><span id="dvProject">—</span></div>
    <span class="pill off" id="dvState"><span class="dot"></span><span>—</span></span>
    <div class="dv-tabs" role="tablist">
      <button role="tab" data-tab="scene">Scene builder</button>
      <button role="tab" data-tab="workflow">Workflow</button>
      <button role="tab" data-tab="hmi">HMI</button>
      <button role="tab" data-tab="calibration">Calibration</button>
    </div>
    <div class="spacer"></div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm btn-icon js-theme-toggle" id="btnTheme" title="Toggle theme"></button>
    </div>
  </header>

  <div class="dv-banner" id="dvBanner" hidden></div>

  <main class="dv-main">
    <!-- 1 · Scene builder -->
    <section class="dv-pane" data-pane="scene" hidden>
      <div class="dv-toolbar">
        <button class="btn btn-primary" id="sbNew"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New component</button>
        <button class="btn" id="sbSave" title="Write the builder's scene into the project's scene files">Save to project</button>
        <div class="dv-sep"></div>
        <span class="muted dv-sel" id="sbSel">Parts with settings show a settings button in the list.</span>
        <button class="btn" id="sbParams" hidden title="This part's settings: pins, ports, simulation…"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>Settings</button>
        <button class="btn" id="sbCamera" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Camera</button>
        <button class="btn" id="sbVision" hidden title="Open this camera's vision server GUI — build and test its detections"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Vision configurator</button>
        <div class="spacer"></div>
        <button class="btn btn-ghost" id="sbThumb" title="Use the current view as this project's picture on the Projects page">Save picture</button>
      </div>
      <iframe class="dv-frame" id="sbFrame" title="Scene builder"></iframe>
    </section>

    <!-- 2 · Workflow: the project page itself (3D view, run controls,
         steps, devices and their buttons), with the scene's simulation
         switches one click away -->
    <section class="dv-pane" data-pane="workflow" hidden>
      <div class="dv-toolbar">
        <button class="btn" id="wfSimBtn" title="Which devices are simulated — saved to the project's scene"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="5"/><circle cx="16" cy="12" r="3"/></svg><span id="wfSimSum">Simulation</span></button>
        <div class="spacer"></div>
        <a class="btn btn-ghost" id="wfOperator" target="_blank" rel="noopener" title="The project page in its own tab">Open in a new tab</a>
      </div>
      <iframe class="dv-frame" id="wfFrame" title="Project page"></iframe>
    </section>

    <!-- 3 · HMI -->
    <section class="dv-pane" data-pane="hmi" hidden>
      <div class="dv-toolbar">
        <div class="dv-seg" id="hmiSeg">
          <button data-v="both" class="on">Side by side</button><button data-v="main">Main</button><button data-v="setup">Parameters</button>
        </div>
        <span class="muted dv-small" id="hmiMsg"></span>
        <div class="spacer"></div>
        <button class="btn btn-ghost" id="hmiReload">Reload</button>
      </div>
      <div class="dv-hmi" id="hmiGrid" data-v="both">
        <div class="dv-hmi-col" data-screen="main"><div class="section-label">Main</div><iframe class="dv-frame" id="hmiMain" title="Main page"></iframe></div>
        <div class="dv-hmi-col" data-screen="setup"><div class="section-label">Parameters</div><iframe class="dv-frame" id="hmiSetup" title="Parameters page"></iframe></div>
      </div>
    </section>

    <!-- 4 · Calibration -->
    <section class="dv-pane" data-pane="calibration" hidden>
      <iframe class="dv-frame" id="calFrame" title="Calibration"></iframe>
    </section>
  </main>
</div>

<!-- floating windows (Parameters, Camera, Simulation) -->
<div id="dvWins"></div>

<script src="/vendor/theme.js"></script>
<script src="/vendor/confirm.js"></script>
<script src="/vendor/nav.js"></script>
<script type="module" src="/dev/dev.js"></script>
<script src="/vendor/account.js"></script>
<script src="/vendor/ai_chat.js"></script>
</body>
</html>
