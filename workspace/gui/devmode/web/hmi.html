<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>HMI preview</title>
  <script>(function(){ document.documentElement.setAttribute("data-theme", localStorage.getItem("orch_theme")||"light"); })();</script>
  <link rel="stylesheet" href="/vendor/base.css"/>
  <link rel="stylesheet" href="/orchestrator/style.css"/>
  <style>
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
    .hp { padding: var(--space-5); box-sizing: border-box; min-height: 100vh; }
    .hp-empty { color: var(--muted); text-align: center; line-height: 1.6; padding: 15vh var(--space-5) 0; font-size: var(--text-md); }
    .hp-empty b { color: var(--text); display: block; font-size: var(--text-lg); margin-bottom: var(--space-2); }
    .hp-stamp { position: fixed; right: var(--space-3); bottom: var(--space-3); font-size: var(--text-xs); color: var(--muted); background: var(--surface); padding: var(--space-1) var(--space-3); border-radius: var(--radius-xs); box-shadow: var(--shadow-sm); }
  </style>
</head>
<body>
<div class="hp" id="hp"></div>
<div class="hp-stamp" id="stamp" hidden></div>
<script type="module">
// One HMI screen of a project, before launch, re-mounted whenever its
// files change (Developer mode › HMI).
//   ?screen=setup — the Parameters page: the project's setup screen, or
//                   the generic form, exactly as the operator gets it.
//   ?screen=main  — the Main page: the project's pendant screen, mounted
//                   with sample values (nothing is running).
import { renderKwargsForm, mountScreen, loadScene } from "/orchestrator/kwargs.js";

const q = new URLSearchParams(location.search);
const PROJECT = q.get("project") || "";
const SCREEN = q.get("screen") === "main" ? "main" : "setup";
const API = `/dev/api/projects/${encodeURIComponent(PROJECT)}`;
const hp = document.getElementById("hp");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let sig = null;

const empty = (title, text) => { hp.innerHTML = `<div class="hp-empty"><b>${esc(title)}</b>${esc(text)}</div>`; };

async function mountSetup() {
  const r = await fetch(`/orchestrator/api/workspace/${encodeURIComponent(PROJECT)}/launch_config`, { cache: "no-store" });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  const schema = j.kwargs_schema || {};
  // A changed screen module must load again: the browser keeps an
  // imported module per URL, so each version gets its own.
  if (schema._setup) schema._setup = { ...schema._setup, src: `${schema._setup.src}?v=${sig}` };
  if (!Object.keys(schema).some(k => !k.startsWith("_"))) {
    return empty("No parameters", "This project's launch.yaml declares no run parameters (default:).");
  }
  hp.innerHTML = "";
  const box = document.createElement("div");
  box.className = "kwargs-form";
  hp.appendChild(box);
  renderKwargsForm(box, schema, j.kwargs_values || {}, false, PROJECT);
}

async function mountMain(spec) {
  if (!spec.pendant) {
    return empty("Default Main page",
      spec.pendant_decl ? `launch.yaml's pendant: ${spec.pendant_decl} is drawn from widgets — launch the project to see it.`
                        : "This project has no Main screen of its own (launch.yaml pendant:). The platform's default shows while it runs.");
  }
  hp.innerHTML = "";
  const holder = document.createElement("div");
  hp.appendChild(holder);
  const scene = await loadScene(PROJECT);
  const values = {};
  const api = {
    scene, values, records: [],
    onRecords() {},
    get theme() { return document.documentElement.getAttribute("data-theme") || "light"; },
    onTheme() {},
    invoke: async () => ({ ok: false, msg: "Preview — the project is not running" }),
    url: p => p,
  };
  const mod = await mountScreen(holder, { ...spec.pendant, src: `${spec.pendant.src}?v=${sig}` }, `${API}/hmi/pendant/`, api);
  try { mod?.update?.(values); } catch (_) {}
}

async function refresh(force) {
  let spec;
  try {
    const r = await fetch(`${API}/hmi`, { cache: "no-store" });
    if (r.status === 401) return empty("Log in for Developer mode", "");
    spec = await r.json();
  } catch (_) { return; }
  if (!force && spec.sig === sig) return;
  sig = spec.sig;
  try {
    if (SCREEN === "setup") await mountSetup(); else await mountMain(spec);
    const st = document.getElementById("stamp");
    st.textContent = `Updated ${new Date().toTimeString().slice(0, 8)}`;
    st.hidden = false;
  } catch (e) {
    empty("This screen failed to load", e.message || String(e));
  }
}
refresh(true);
setInterval(refresh, 2000);
// The host page's theme toggle reaches the preview.
addEventListener("storage", e => { if (e.key === "orch_theme") document.documentElement.setAttribute("data-theme", e.newValue || "light"); });
</script>
</body>
</html>
