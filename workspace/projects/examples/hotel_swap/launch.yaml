# hotel_swap example — launch config.

project_name: hotel_swap_example
port:         5010
scene:        [scene/base.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat

kwargs:
  level_count:
    type: int
    default: 2
    label: Level count
    hint: Number of hotel-level pairs to swap between the two hotels.
    min: 1
    max: 4
