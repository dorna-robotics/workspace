# runtime example — launch config.
#
# Demonstrates RUNTIME scene mutation: a disc is spawned into the scene
# programmatically (workspace.add_component), not declared in the scene
# yaml like the other examples — and removed again later
# (workspace.remove_component). The scene below is just the bench
# chassis + a tool the robot can pick the disc with.

project_name: runtime
port:         5010
# Self-contained: a local copy of the core_500 chassis (core + rail +
# 6 plates + boundary collision boxes), then the project's own layout.
scene:        [scene/core_500.j2, scene/layout.j2]
recipes:      recipes.j2
actions:      actions.py
checks:       checks.py

plan_window:  4
scheduler:    cpsat

# One cycle = create a disc at a random in slot → transfer it to a
# random out slot → remove it. ``batch_size`` is how many cycles to run.
kwargs:
  batch_size:
    type: int
    default: 5
    label: Batch size
    hint: Number of create → transfer → remove cycles to run.
    min: 1
    max: 50
