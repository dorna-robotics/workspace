# test/launch.yaml — minimal smoke-test launcher.
# Drives a single workflow state ("rotated") through the BaseWorkflow
# OR-tools planner; just enough to exercise the device-bus integration
# end-to-end on real hardware. See docs/project-guide.md §3 for the
# full kwarg schema.

scene: [scene/base.j2, scene/layout.j2]

kwargs:
  batch_size:
    type: int
    default: 1
    label: Iterations
    hint: How many times to run the rotated state
    min: 1
    max: 10

  rotation_deg:
    type: int
    default: 10
    label: Rotation (degrees)
    hint: How far to rotate j5 each iteration
    min: -175
    max: 175
