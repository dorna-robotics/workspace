# pace_bt/launch.yaml
# Project configuration and launch parameters.
# The orchestrator reads this file to set up the workspace and GUI.

scene: [scene/base.j2]

# kwargs — passed to workflow_fn at runtime.
# Supported types: int, float, str, bool, choice, textarea, file
# Fields: type, default, label, hint, placeholder, optional, accept, options, min, max, rows
kwargs:
  batch_size:
    type: int
    default: 4
    label: Batch size
    hint: Number of items (tubes) to process in this run.
    min: 1
    max: 20
  tick_hz:
    type: float
    default: 10.0
    label: Tick rate (Hz)
    hint: How often the BT engine ticks the tree. 10 Hz is the default.
    min: 1.0
    max: 50.0
