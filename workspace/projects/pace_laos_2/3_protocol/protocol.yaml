# 3_protocol/protocol.yaml
# Grouped states — each state is a phase with multiple recipe calls inside.
# The RL learns optimal ordering of phases and tool batching.

states:

  - name: inspected
    description: pick tube, inspect, weigh, decap, place in working rack
    requires: []

  - name: dosed_40ml
    description: dose solvent into working tube
    requires: [inspected]

  - name: loaded_shaker
    description: recap tube and place on shaker
    requires: [dosed_40ml]

  - name: shaken
    description: shaker runs — no robot needed, RL fills idle time
    background: true
    duration: shake_duration
    duration_steps: [3, 8]      # randomized per episode — RL learns time concept
    requires: [loaded_shaker]

  - name: cap_fed
    description: feed one cap from autosampler to cap holder
    optional: true
    requires: []                # can happen anytime — RL decides when

  - name: retrieved
    description: pick from shaker, inspect, decap, place in working rack
    requires: [shaken]

  - name: dosed_2ml
    description: dose from 40ml into 2ml vials
    requires: [retrieved]

  - name: recapped_final
    description: recap 40ml tube and return to source rack
    requires: [dosed_2ml]

  - name: capped_2ml
    description: cap 2ml vial, inspect, place in rack
    requires: [cap_fed, dosed_2ml]

goal:
  - recapped_final
  - capped_2ml
