<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>B — Rack-centric HMI</title><link rel="stylesheet" href="mock.css"/>
<style>
.hmi { padding:30px 36px; display:flex; flex-direction:column; gap:20px; }
.staterow { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.state-big { font-size:36px; font-weight:800; letter-spacing:-0.4px; }
.chip { font-weight:700; color:var(--accent); background:rgba(0,122,255,0.1);
  padding:8px 16px; border-radius:999px; font-size:15px; }
.rackwrap { display:flex; gap:26px; align-items:center; justify-content:center; flex-wrap:wrap; }
.rack { display:grid; grid-template-columns:repeat(4,64px); gap:12px;
  background:var(--bg); padding:20px; border-radius:var(--r-lg); }
.slot { width:64px; height:64px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-weight:800; font-size:15px; color:#fff;
  font-family:var(--mono); }
.slot.done    { background:var(--green); }
.slot.active  { background:var(--accent); box-shadow:0 0 0 5px rgba(0,122,255,0.25); animation:pulse 1.6s infinite; }
.slot.pending { background:#c9c9cf; color:#6f6f74; }
.slot.error   { background:var(--red); }
@keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(0,122,255,0.12);} }
.legend { display:flex; flex-direction:column; gap:10px; font-size:14.5px; font-weight:600; color:var(--muted); }
.legend i { display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:8px; vertical-align:-2px; }
.kv { display:flex; gap:14px; }
.stat { flex:1; background:var(--bg); border-radius:var(--r-md); padding:14px 18px; }
.stat .v { font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; }
.stat .v small { font-size:15px; color:var(--muted); margin-left:3px; }
.stat .l { color:var(--muted); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em; }
</style></head><body>
<div class="topbar"><span class="pill"><span class="dot"></span>RUNNING</span><span class="clock">3:42</span><span style="width:110px"></span></div>
<div class="stage">
  <div class="card hmi">
    <div class="staterow">
      <div class="state-big">Shaking pair 2</div>
      <div class="chip">6 of 8 tubes · ~4 min left</div>
    </div>
    <div class="rackwrap">
      <div class="rack">
        <div class="slot done">A1</div><div class="slot done">A2</div><div class="slot done">A3</div><div class="slot done">A4</div>
        <div class="slot done">B1</div><div class="slot active">B2</div><div class="slot pending">B3</div><div class="slot pending">B4</div>
      </div>
      <div class="legend">
        <div><i style="background:var(--green)"></i>Done</div>
        <div><i style="background:var(--accent)"></i>In progress</div>
        <div><i style="background:#c9c9cf"></i>Waiting</div>
        <div><i style="background:var(--red)"></i>Needs attention</div>
      </div>
    </div>
    <div class="kv">
      <div class="stat"><div class="v">12.4<small>g</small></div><div class="l">Last weight</div></div>
      <div class="stat"><div class="v">10<small>s</small></div><div class="l">Shake cycle</div></div>
      <div class="stat"><div class="v" style="color:var(--green)">OK</div><div class="l">Devices</div></div>
    </div>
  </div>
  <div class="controls">
    <button class="cbtn disabled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>Resume</button>
    <button class="cbtn pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>Pause</button>
    <button class="cbtn disabled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Launch</button>
    <button class="cbtn park"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>Park</button>
  </div>
  <div class="secrow">
    <button class="sbtn">⚙ Parameters</button>
    <button class="sbtn">▦ Controls</button>
    <button class="sbtn kill">✕ Kill</button>
  </div>
  <div class="footer-note"><a href="index.html">← all mockups</a></div>
</div>
</body></html>
