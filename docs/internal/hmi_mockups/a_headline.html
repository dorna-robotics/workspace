<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>A — Headline HMI</title><link rel="stylesheet" href="mock.css"/>
<style>
.hmi { padding:34px 38px; display:flex; flex-direction:column; gap:22px; }
.state-line { display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.state-big { font-size:44px; font-weight:800; letter-spacing:-0.5px; }
.state-sub { color:var(--muted); font-size:17px; font-weight:600; }
.bigbar { height:22px; border-radius:999px; background:var(--surface2); overflow:hidden; position:relative; }
.bigbar > i { position:absolute; inset:0 45% 0 0; background:linear-gradient(90deg,#0a84ff,#4aa8ff); border-radius:999px; }
.bar-meta { display:flex; justify-content:space-between; color:var(--muted); font-weight:700; font-size:15px; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.stat { background:var(--bg); border-radius:var(--r-md); padding:18px 20px; }
.stat .v { font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; }
.stat .v small { font-size:17px; color:var(--muted); font-weight:700; margin-left:3px; }
.stat .l { color:var(--muted); font-weight:600; font-size:13.5px; text-transform:uppercase; letter-spacing:0.05em; margin-top:3px; }
.details { color:var(--muted); font-size:13px; text-align:center; padding:4px 0 0; }
.details span { border-bottom:1px dashed var(--muted); cursor:pointer; }
</style></head><body>
<div class="topbar"><span class="pill"><span class="dot"></span>RUNNING</span><span class="clock">3:42</span><span style="width:110px"></span></div>
<div class="stage">
  <div class="card hmi">
    <div class="state-line">
      <div class="state-big">Filling tube 3 of 8</div>
      <div class="state-sub">Batch “Morning QC”</div>
    </div>
    <div>
      <div class="bigbar"><i></i></div>
      <div class="bar-meta"><span>55%</span><span>~4 min remaining</span></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="v">12.4<small>g</small></div><div class="l">Last weight</div></div>
      <div class="stat"><div class="v">2 / 8</div><div class="l">Tubes done</div></div>
      <div class="stat"><div class="v" style="color:var(--green)">OK</div><div class="l">All devices</div></div>
    </div>
    <div class="details">engineer timeline: <span>show details</span></div>
  </div>
  <div class="controls">
    <button class="cbtn disabled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>Resume</button>
    <button class="cbtn pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>Pause</button>
    <button class="cbtn disabled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Launch</button>
    <button class="cbtn park"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>Park</button>
  </div>
  <div class="secrow">
    <button class="sbtn">⚙ Parameters</button>
    <button class="sbtn">▦ Controls</button>
    <button class="sbtn kill">✕ Kill</button>
  </div>
  <div class="footer-note"><a href="index.html">← all mockups</a></div>
</div>
</body></html>
